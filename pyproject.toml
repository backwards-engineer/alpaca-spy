[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-macro-lab"
version = "0.1.0"
description = "Cache-first historical SPY and options data collector"
requires-python = ">=3.11"

[project.scripts]
spy-data = "spy_macro_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

